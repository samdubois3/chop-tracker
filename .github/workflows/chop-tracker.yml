name: Chop Tracker

# Times are UTC. NFL game windows in ET:
#   Sun 1:00pm  = 17:00 UTC (EDT) / 18:00 UTC (EST, after early Nov)
#   Sun 4:25pm  = 20:25 UTC (EDT) / 21:25 UTC (EST)
#   Sun 8:20pm  = 00:20 UTC Mon  / 01:20 UTC Mon
#   Mon 8:15pm  = 00:15 UTC Tue  / 01:15 UTC Tue
# The ranges below are wide enough to cover both DST and standard time.

on:
  # GitHub throttles dense cron schedules hard. The old version asked for 42
  # runs a week (three */30 blocks) and was getting roughly 10 - the greedy
  # lines starved the single-time ones that actually mattered. This asks for
  # 13, weighted toward Sunday, and gives each alert its own run 10 minutes
  # ahead instead of hoping one lands nearby.
  #
  # OBSERVED: GitHub runs this workflow about 22-24 minutes after the
  # requested time, consistently. The pre-alert entries are therefore set
  # ~45 min before each alert rather than 10 - at the observed delay they
  # land ~20 min early, and even at zero delay the data is only 45 min old.
  #
  # Times are UTC. The paired entries an hour apart are the daylight-saving
  # fix: cron is fixed UTC, so every Eastern time shifts an hour on Nov 1.
  # One of each pair is the right slot in summer, the other in winter, and
  # the off-one still lands somewhere useful in the slate.
  schedule:
    # --- Sunday football ---
    - cron: "0 19 * * 0"   # 3:00pm ET  - early slate underway
    - cron: "0 20 * * 0"   # 4:00pm ET nominal, ~4:22pm actual - FEEDS THE 4:45pm ALERT (EDT)
    - cron: "0 21 * * 0"   # 5:00pm ET nominal - 4:25pm games (and the alert slot in EST)
    - cron: "0 23 * * 0"   # 7:00pm ET  - late slate finishing
    - cron: "45 0 * * 1"   # 8:45pm ET  - 4:25s final, SNF kicking off
    - cron: "30 3 * * 1"   # 11:30pm ET - SNF nearly done
    - cron: "30 4 * * 1"   # 12:30am ET - SNF final (and 11:30pm in EST)
    # --- Monday ---
    - cron: "0 13 * * 1"   # 9:00am ET  - Sunday's final numbers
    - cron: "15 22 * * 1"   # 6:15pm ET nominal, ~6:38pm actual - FEEDS THE 7:00pm ALERT (EDT)
    - cron: "15 23 * * 1"   # the 6:15pm slot in EST
    - cron: "30 3 * * 2"   # 11:30pm ET - MNF done
    # --- Tuesday ---
    - cron: "0 14 * * 2"   # 10:00am ET - Sleeper locks the week, window final
  workflow_dispatch:              # manual "run now" button

concurrency:
  group: chop-tracker
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the board
        run: |
          python chop_tracker.py --no-color | tee board.txt
          python chop_tracker.py --markdown > STANDINGS.md
          python chop_tracker.py --json > standings.json
          python chop_tracker.py --alert > alert.txt

      - name: Commit the snapshot
        run: |
          git config user.name  "chop-tracker"
          git config user.email "actions@github.com"
          git add STANDINGS.md standings.json alert.txt
          git diff --staged --quiet && exit 0
          git commit -m "chop board: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
